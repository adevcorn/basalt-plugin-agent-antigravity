[package]
name = "basalt-plugin-antigravity"
version = "0.1.0"
edition = "2021"
description = "Google Antigravity CLI launcher plugin for Basalt with model, effort variant, and streaming parser support"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basalt-plugin-sdk = { path = "../basalt-plugin-sdk", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
